name: Bug report
description: Something isn't working as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        **Never paste your GitHub token**, or anything from `token.bin`, into an issue. Issues are public.
        For a security vulnerability, use [private vulnerability reporting](https://github.com/apreynolds1989/reciprocity/security/advisories/new) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw, and what you expected to see instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the panel
        2. Set the sprint to …
        3. …
    validations:
      required: true
  - type: dropdown
    id: how-run
    attributes:
      label: How are you running it?
      options:
        - Installed app (npm run dist)
        - From the repo (npm start)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Windows 11 24H2, macOS 15.2
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The version in package.json, or the output of `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Error messages, screenshots or logs
      description: Remove organization names, usernames or PR titles you don't want to make public.
